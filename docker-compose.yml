services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    image: curemed-web:latest
    container_name: curemed-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Set in Dokploy -> Environment. The image's start-nginx.sh writes these
      # into /usr/share/nginx/html/config.js at container startup.
      RUNTIME_SUPABASE_URL: ${RUNTIME_SUPABASE_URL}
      RUNTIME_SUPABASE_ANON_KEY: ${RUNTIME_SUPABASE_ANON_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
