services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    image: curemed-web:latest
    container_name: curemed-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Set these in Dokploy -> Environment. They are written into
      # /usr/share/nginx/html/config.js at container startup so the frontend
      # talks to the self-hosted Supabase instead of Lovable Cloud.
      RUNTIME_SUPABASE_URL: ${RUNTIME_SUPABASE_URL}
      RUNTIME_SUPABASE_ANON_KEY: ${RUNTIME_SUPABASE_ANON_KEY}
    # $${VAR} escapes docker-compose interpolation so the literal ${VAR}
    # reaches the container shell, which expands it against the container env.
    command: >
      sh -c 'printf "%s\n" \
        "window.__APP_CONFIG__ = {" \
        "  SUPABASE_URL: \"$${RUNTIME_SUPABASE_URL}\"," \
        "  SUPABASE_ANON_KEY: \"$${RUNTIME_SUPABASE_ANON_KEY}\"" \
        "};" \
        > /usr/share/nginx/html/config.js
        nginx -g "daemon off;"'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
